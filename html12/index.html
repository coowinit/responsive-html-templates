<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inner Page CTA | Classic Theme Blueprint</title>
  <meta name="description" content="Reusable inner-page call-to-action component preview.">
  <link rel="preload" href="assets/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/font.css">
  <link rel="stylesheet" href="assets/css/components/inner-page-cta.css">
</head>
<body>
  <main>
    <!-- Reusable section: only extract this section when integrating into another page. -->
    <section class="inner-cta" aria-labelledby="inner-cta-title">
      <div class="inner-cta-container">
        <div class="inner-cta-panel">
          <div class="inner-cta-content">
            <p class="inner-cta-eyebrow">LET'S CONNECT</p>
            <h2 class="inner-cta-title" id="inner-cta-title">Have a Project in Mind?</h2>
            <p class="inner-cta-description">
              Tell us what you're working on, and start a practical conversation about your requirements.
            </p>
          </div>
          <a class="inner-cta-button" href="mailto:hello@example.com">
            Contact Us <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
