<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="响应式产品配方比例展示组件：桌面四列卡片，移动端纵向堆叠。">
  <title>产品材料配方比例卡片</title>
  <link rel="stylesheet" href="./assets/css/formula-cards.css">
</head>
<body>
  <!-- 独立组件。复制 section.s34 与其 CSS 即可复用；无 JavaScript 依赖。 -->
  <section class="s34" aria-labelledby="s34-title">
    <div class="s34-wrap">
      <header class="s34-head">
        <h1 id="s34-title">更科学的产品配方</h1>
        <p>45% PVC + 28% 木粉 + 20% 碳酸钙粉 + 7% 添加剂</p>
      </header>

      <div class="s34-grid">
        <article class="s34-item">
          <div class="s34-card">
            <span class="s34-percent">28%</span>
            <h2>木粉</h2>
            <p>精选优质木粉，赋予产品自然细腻的表面纹理，兼顾良好的结构强度与加工性能。</p>
          </div>
        </article>

        <article class="s34-item">
          <div class="s34-card">
            <span class="s34-percent">45%</span>
            <h2>PVC</h2>
            <p>采用适合产品需求的 PVC 原料，为复合材料提供稳定的成型性能与可靠的使用表现。</p>
          </div>
        </article>

        <article class="s34-item">
          <div class="s34-card">
            <span class="s34-percent">20%</span>
            <h2>碳酸钙粉</h2>
            <p>合理控制碳酸钙粉的添加比例，兼顾材料的尺寸稳定性、加工性能与整体结构表现。</p>
          </div>
        </article>

        <article class="s34-item">
          <div class="s34-card">
            <span class="s34-percent">7%</span>
            <h2>功能添加剂</h2>
            <p>根据应用需求加入适量功能添加剂，帮助改善材料的加工表现与产品性能。</p>
          </div>
        </article>
      </div>
      <!-- 演示用文案和比例，请按实际产品配方核实后再用于生产网站。 -->
    </div>
  </section>
</body>
</html>
