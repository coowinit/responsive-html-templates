<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Responsive product category cards with image color change on hover.">
  <title>Shop by Category — Rectangular Cards</title>
  <link rel="stylesheet" href="assets/css/category-grid.css">
</head>
<body style="margin:0">
  <!-- Copy only this section into your existing homepage. -->
  <section class="category-grid" aria-labelledby="category-grid-title">
    <div class="category-grid__container">
      <header class="category-grid__header">
        <h2 id="category-grid-title">Shop by Category</h2>
        <p>Explore our straw hat collections for wholesale and custom orders.</p>
      </header>
      <div class="category-grid__list">
        <a class="category-grid__link" href="#" aria-label="Explore Bags">
          <span class="category-grid__media"><img src="images/cat01-Bags.webp" width="600" height="600" alt="" /></span>
          <span class="category-grid__title">Bags</span>
        </a>
        <a class="category-grid__link" href="#" aria-label="Explore Bodies">
          <span class="category-grid__media"><img src="images/cat02-Bodies.webp" width="600" height="600" alt="" /></span>
          <span class="category-grid__title">Bodies</span>
        </a>
        <a class="category-grid__link" href="#" aria-label="Explore Placemats">
          <span class="category-grid__media"><img src="images/cat03-Placemats.webp" width="600" height="600" alt="" /></span>
          <span class="category-grid__title">Placemats</span>
        </a>
        <a class="category-grid__link" href="#" aria-label="Explore Strawhats">
          <span class="category-grid__media"><img src="images/cat04-Strawhats.webp" width="600" height="600" alt="" /></span>
          <span class="category-grid__title">Strawhats</span>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
