<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop by Category</title>
  <link rel="stylesheet" href="assets/css/shop-category.css">
</head>
<body>
  <!-- Shop by Category: START -->
  <section class="shop-category" aria-labelledby="shop-category-title">
    <div class="shop-category__container">
      <div class="shop-category__header">
        <h2 id="shop-category-title">Shop by Category</h2>
        <p>Explore our straw hat collections for wholesale and custom orders.</p>
      </div>
      <div class="shop-category__grid">
        <a class="shop-category__item" href="#" aria-label="Explore Straw Hats">
          <span class="shop-category__circle">
            <svg class="shop-category__placeholder" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="9" y="11" width="46" height="42" rx="5"/><circle cx="23" cy="24" r="5"/><path d="M12 47 26 34l9 8 8-7 10 11"/></svg>
          </span>
          <span class="shop-category__name">Straw Hats</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Panama Hats">
          <span class="shop-category__circle">
            <svg class="shop-category__placeholder" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="9" y="11" width="46" height="42" rx="5"/><circle cx="23" cy="24" r="5"/><path d="M12 47 26 34l9 8 8-7 10 11"/></svg>
          </span>
          <span class="shop-category__name">Panama Hats</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Raffia Hats">
          <span class="shop-category__circle">
            <svg class="shop-category__placeholder" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="9" y="11" width="46" height="42" rx="5"/><circle cx="23" cy="24" r="5"/><path d="M12 47 26 34l9 8 8-7 10 11"/></svg>
          </span>
          <span class="shop-category__name">Raffia Hats</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Sun Visors">
          <span class="shop-category__circle">
            <svg class="shop-category__placeholder" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="9" y="11" width="46" height="42" rx="5"/><circle cx="23" cy="24" r="5"/><path d="M12 47 26 34l9 8 8-7 10 11"/></svg>
          </span>
          <span class="shop-category__name">Sun Visors</span>
        </a>
      </div>
    </div>
  </section>
  <!-- Shop by Category: END -->
</body>
</html>
