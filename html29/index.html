<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop by Category</title>
  <link rel="stylesheet" href="assets/css/shop-category.css">
</head>
<body>
  <!-- Shop by Category: START -->
  <section class="shop-category" aria-labelledby="shop-category-title">
    <div class="shop-category__container">
      <div class="shop-category__header">
        <h2 id="shop-category-title">Shop by Category</h2>
        <p>Explore our straw hat collections for wholesale and custom orders.</p>
      </div>
      <div class="shop-category__grid">
        <a class="shop-category__item" href="#" aria-label="Explore Bags">
          <span class="shop-category__circle">
            <img src="images/cat01-Bags.webp" class="shop-category__product" width="600" height="600" alt="" loading="lazy" />
          </span>
          <span class="shop-category__name">Bags</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Bodies">
          <span class="shop-category__circle">
            <img src="images/cat02-Bodies.webp" class="shop-category__product" width="600" height="600" alt="" loading="lazy" />
          </span>
          <span class="shop-category__name">Bodies</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Placemats">
          <span class="shop-category__circle">
            <img src="images/cat03-Placemats.webp" class="shop-category__product" width="600" height="600" alt="" loading="lazy" />
          </span>
          <span class="shop-category__name">Placemats</span>
        </a>
        <a class="shop-category__item" href="#" aria-label="Explore Strawhats">
          <span class="shop-category__circle">
            <img src="images/cat04-Strawhats.webp" class="shop-category__product" width="600" height="600" alt="" loading="lazy" />
          </span>
          <span class="shop-category__name">Strawhats</span>
        </a>
      </div>
    </div>
  </section>
  <!-- Shop by Category: END -->
</body>
</html>
