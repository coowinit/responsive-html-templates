<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Responsive footer quick links with a single hover halo animation.">
  <title>Footer Quick Links — Responsive Component</title>
  <link rel="stylesheet" href="css/footer-quick-links.css">

</head>

          </span>

        </a>
        <a class="fql__card" href="#deck-design-tools">
          <span class="fql__icon" aria-hidden="true">
