<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive roofing services layout with interactive category navigation and image details.">
  <title>Roofing Services Layout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="s25" id="s25-roofing-services">
    <div class="s25-inner">
      <nav class="s25-nav" aria-label="Roofing service categories">
        <button class="s25-nav-item is-active" type="button" data-service="commercial" aria-pressed="true">
          <span class="s25-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="14" rx="1.5"/><path d="M9 21V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V21M8 11h2m4 0h2M8 15h2m4 0h2"/></svg>
          </span>
          <span class="s25-nav-label">Commercial Roofing</span>
          <span class="s25-nav-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="s25-nav-item" type="button" data-service="industrial" aria-pressed="false">
          <span class="s25-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 20V8.5L12 3l9 5.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M7 21v-8h10v8M7 9h10M7 16h10"/></svg>
          </span>
          <span class="s25-nav-label">Industrial Roofing</span>
          <span class="s25-nav-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="s25-nav-item" type="button" data-service="residential" aria-pressed="false">
          <span class="s25-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-7h6v7"/></svg>
          </span>
          <span class="s25-nav-label">Residential Roofing</span>
          <span class="s25-nav-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="s25-nav-item" type="button" data-service="retail" aria-pressed="false">
          <span class="s25-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 10V21h16V10M3 10l2-6h14l2 6"/><path d="M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M9 21v-6h6v6"/></svg>
          </span>
          <span class="s25-nav-label">Retail Roofing</span>
          <span class="s25-nav-arrow" aria-hidden="true">↗</span>
        </button>
      </nav>

      <section class="s25-detail" aria-live="polite" aria-atomic="true">
        <div class="s25-gallery">
          <div class="s25-image s25-image-main">
            <img id="s25-image-main" src="images/commercial-main.svg" alt="Commercial roofing project placeholder">
          </div>
          <div class="s25-image s25-image-secondary">
            <img id="s25-image-secondary" src="images/commercial-secondary.svg" alt="Commercial building roof placeholder">
          </div>
        </div>
        <div class="s25-copy">
          <h1 id="s25-title">Commercial Roofing</h1>
          <p id="s25-description">Dependable roofing solutions for offices, business parks, and commercial properties, designed to protect your building and keep daily operations running smoothly.</p>
          <a class="s25-link" id="s25-link" href="#service-details">VIEW SERVICE <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
