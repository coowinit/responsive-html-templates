<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Gallery | Standalone Component Lab</title>
  <link rel="stylesheet" href="assets/vendor/swiper/14.3.0/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/components/product-gallery.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 Arial, sans-serif; color: #1c2b35; }
    main { max-width: 760px; padding: 40px 20px 90px; margin: auto; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    .note { color: #60727e; margin-bottom: 26px; }
  </style>
</head>
<body>
  <main>
    <h1>Product Gallery — Component Lab</h1>
    <p class="note">Choose a thumbnail, click for Lightbox, or swipe on mobile. Demonstration images only.</p>
          <div class="product-gallery" data-product-gallery>
            <div class="pg-layout">
              <div class="pg-rail">
                <button class="pg-thumb-prev" type="button" aria-label="Previous thumbnails">↑</button>
                <div class="pg-thumbs swiper" aria-label="Product thumbnails">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <button class="pg-thumb is-active" type="button" aria-label="Show image 1: Main composite decking photo" aria-pressed="true">
                        <img src="assets/images/product-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 2: Decking detail and finish" aria-pressed="false">
                        <img src="assets/images/about-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 3: Material structure" aria-pressed="false">
                        <img src="assets/images/quality-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 4: Application reference" aria-pressed="false">
                        <img src="assets/images/team-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 5: Additional product view" aria-pressed="false">
                        <img src="assets/images/product-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 6: Additional product perspective" aria-pressed="false">
                        <img src="assets/images/about-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                    <div class="swiper-slide">
                      <button class="pg-thumb" type="button" aria-label="Show image 7: Additional product detail" aria-pressed="false">
                        <img src="assets/images/quality-placeholder.svg" width="120" height="120" loading="lazy" alt="">
                      </button>
                    </div>
                  </div>
                </div>
                <button class="pg-thumb-next" type="button" aria-label="Next thumbnails">↓</button>
              </div>
              <div class="pg-stage">
                <div class="pg-main swiper">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <img src="assets/images/product-placeholder.svg" alt="Main composite decking photo" width="800" height="800" fetchpriority="high">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/about-placeholder.svg" alt="Decking detail and finish" width="800" height="800" loading="lazy">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/quality-placeholder.svg" alt="Material structure" width="800" height="800" loading="lazy">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/team-placeholder.svg" alt="Application reference" width="800" height="800" loading="lazy">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/product-placeholder.svg" alt="Additional product view" width="800" height="800" loading="lazy">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/about-placeholder.svg" alt="Additional product perspective" width="800" height="800" loading="lazy">
                    </div>
                    <div class="swiper-slide">
                      <img src="assets/images/quality-placeholder.svg" alt="Additional product detail" width="800" height="800" loading="lazy">
                    </div>
                  </div>
                </div>
                
              </div>
            </div>
          </div>
  </main>
  <script src="assets/vendor/swiper/14.3.0/swiper-bundle.min.js"></script>
  <script src="assets/js/components/product-gallery.js"></script>
</body>
</html>
