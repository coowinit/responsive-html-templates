<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="响应式企业里程碑时间轴，支持卡片横向滑动与卡片内部独立图片轮播。">
  <title>HTML38 · 企业发展历程与嵌套图片轮播</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
<main class="page-shell">
  <section class="milestones" aria-labelledby="timeline-title">
    <header class="milestones-header">
      <h1 id="timeline-title">从网站架构到智能化运营<br>探索 WordPress 技术实践</h1>
      <div class="milestones-intro">
        <p>以 WordPress 网站建设与运营为主题，用时间轴梳理不同阶段的技术实践。每个节点都可以展示多张项目图片与简要说明。</p>
        <a class="more-link" href="https://wordpress.org/documentation/" target="_blank" rel="noopener noreferrer">了解更多 <span aria-hidden="true">→</span></a>
      </div>
    </header>

    <div class="timeline-toolbar">
      <button class="nav-button" id="timeline-prev" type="button" aria-label="上一个里程碑">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      </button>
      <span class="year-range" id="year-range" aria-live="polite">2017 ~ 2019</span>
      <button class="nav-button" id="timeline-next" type="button" aria-label="下一个里程碑">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </button>
    </div>

    <div class="timeline-track" id="timeline-track" tabindex="0" role="region" aria-roledescription="轮播" aria-label="WordPress 发展里程碑，左右滑动查看更多">
      <!-- cards inserted from local data by JavaScript -->
    </div>
    <footer class="timeline-footer">
      <div class="timeline-progress" id="timeline-progress" role="progressbar" aria-label="里程碑浏览进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="timeline-progress-thumb" id="timeline-progress-thumb"></span>
      </div>
      <span class="timeline-years">2017 – 2024</span>
    </footer>
  </section>
</main>
</body>
</html>
