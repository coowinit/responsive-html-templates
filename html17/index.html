<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Responsive basketball club introduction layout with image-led storytelling and key impact statistics.">
  <title>Basketball Club — Image and Statistics Layout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="basketball-page">
    <section class="club-intro" aria-labelledby="club-title">
      <div class="club-intro__image club-intro__image--main">
        <img src="images/basketball-hoop.svg" alt="Portrait image placeholder" width="502" height="581">
      </div>

      <div class="club-intro__content">
        <p class="club-intro__eyebrow">BUILDING CHAMPIONS</p>
        <h1 id="club-title">Empower lives through basketball</h1>
        <p class="club-intro__description">
          Goal is a top basketball club in Chicago, helping athletes grow through
          expert coaching, skill clinics, and strong community support.
        </p>
      </div>

      <div class="club-intro__image club-intro__image--secondary">
        <img src="images/basketball-player.svg" alt="Landscape image placeholder" width="608" height="463" loading="lazy">
      </div>
    </section>

    <section class="club-stats" aria-label="Club facts and achievements">
      <article class="club-stat">
        <p class="club-stat__label">Founded in 2014</p>
        <p class="club-stat__value">2023</p>
      </article>
      <article class="club-stat">
        <p class="club-stat__label">Chicago location</p>
        <p class="club-stat__value">Hub</p>
      </article>
      <article class="club-stat">
        <p class="club-stat__label">Coaching staff</p>
        <p class="club-stat__value">28</p>
      </article>
      <article class="club-stat">
        <p class="club-stat__label">Grants secured</p>
        <p class="club-stat__value">$15.5M</p>
      </article>
    </section>
  </main>
</body>
</html>
